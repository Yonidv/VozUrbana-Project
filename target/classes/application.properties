# =====================================================================
# CONFIGURACION DE LA CADENA DE CONEXION (POSTGRESQL)
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/gestion_municipal
spring.datasource.username=postgres
spring.datasource.password=root

# =====================================================================
# CONFIGURACION DE JPA / HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# CONFIGURACION DE FLYWAY (MIGRACIONES)
# =====================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# =====================================================================
# CONFIGURACION DE IMAGENES 
# =====================================================================
app.file.base.url=http://localhost:8080/images/
file.upload-dir=C:/imagenes-api/
