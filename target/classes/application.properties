# =====================================================================
# CONFIGURACION DE LA CADENA DE CONEXION (SQL SERVER)
# =====================================================================
spring.datasource.url=jdbc:sqlserver://localhost:50746;databaseName=gestion_municipal;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=sql

# =====================================================================
# CONFIGURACION DE JPA / HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# CONFIGURACION DE FLYWAY (MIGRACIONES)
# =====================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true