# =====================================================================
# CONFIGURACIÓN DE LA CADENA DE CONEXIÓN (SQL SERVER)
# =====================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gestion_municipal;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=1234

# =====================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# CONFIGURACIÓN DE FLYWAY (MIGRACIONES)
# =====================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
